name: Notificacion CI a ntfy

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar script Hola Mundo
        run: node index.js

      - name: Enviar notificacion a ntfy.sh
        run: |
          curl -H "Title: Hola Mundo en JavaScript" \
               -H "Tags: white_check_mark,rocket" \
               -d "Integración continua ejecutada correctamente en la rama main. Subido por: ${{ github.actor }}" \
               https://ntfy.sh/devops-itla
